# Site settings
title: Apache Storm
description: "Apache Storm is a free and open source distributed realtime computation system. Storm makes it easy to reliably process unbounded streams of data, doing for realtime processing what Hadoop did for batch processing."
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://storm.apache.org" # the base hostname & protocol for your site
github_username: apache/storm

# Build settings
markdown: redcarpet
redcarpet:
  extensions: ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data"]

keep_files:   [".git", ".svn"]
encoding:     "utf-8"
exclude:
  - README.md
  - vendor/