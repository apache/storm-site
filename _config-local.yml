# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# Site settings
title: Apache Storm
baseurl: "" # the subpath of your site, e.g. /blog/
url: "http://localhost:4000" # the base hostname & protocol for your site
github_username: apache/storm

# Build settings
markdown: redcarpet
redcarpet:
  extensions: ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data"]

keep_files:   [".git", ".svn"]
encoding:     "utf-8"

# Local dev only: skip old release docs so `jekyll serve --watch` stays fast.
# Production (_config.yml + GitHub Actions) still builds every release.
# The latest 2.8.x version and the `current` symlink remain buildable.
exclude:
  - README.md
  - vendor/
  - releases/1.2.3
  - releases/1.2.4
  - releases/2.0.0
  - releases/2.1.0
  - releases/2.1.1
  - releases/2.2.0
  - releases/2.2.1
  - releases/2.3.0
  - releases/2.4.0
  - releases/2.5.0
  - releases/2.6.0
  - releases/2.6.1
  - releases/2.6.2
  - releases/2.6.3
  - releases/2.6.4
  - releases/2.7.0
  - releases/2.7.1
  - releases/2.8.0
  - releases/2.8.1
  - releases/2.8.2
  - releases/2.8.3
  - releases/2.8.4
  - releases/2.8.5
  - releases/2.8.6



